[project]
name = "dashboard-eb-wo"
version = "0.1.0"
description = "Prototype dashboard for EB-WO"
#readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastexcel",
    "polars",
    "streamlit",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.poe.tasks]
lint = "ruff check"
lint-fix = "ruff check --fix"
format = "ruff format --check"
format-fix = "ruff format"
type = "ty check"
all = ["format-fix", "lint-fix", "type"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "C",
    "RUF",
]
